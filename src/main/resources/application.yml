spring:
  datasource:
    url: jdbc:h2:mem:kanban;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate.ddl-auto: update
    show-sql: true
  h2:
    console.enabled: true
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
